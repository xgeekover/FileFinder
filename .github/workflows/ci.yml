name: CI / CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python-version: ["3.12", "3.13"]

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python with matrix version and pip cache
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # Step 3: Install system Qt libraries on Ubuntu
      - name: Install system Qt dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-sync1 \
            libxi6 \
            libxrender1

      # Step 3 (cont): Install Python runtime and dev dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e .

      # Step 4: Run linter
      - name: Run linter
        run: |
          ruff check .

      # Step 5: Run type checker
      - name: Run type checker
        run: |
          mypy app

      # Step 6: Run full test suite with offscreen Qt platform
      - name: Run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pytest tests/

      # Step 7: Build executable with PyInstaller (per-platform execution)
      - name: Build executable with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller packaging/filefinder.spec --clean --noconfirm
          ./dist/FileFinder.app/Contents/MacOS/FileFinder --version

      - name: Build executable with PyInstaller (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller packaging/filefinder.spec --clean --noconfirm
          ./dist/FileFinder/FileFinder --version

      - name: Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller packaging\filefinder.spec --clean --noconfirm
          .\dist\FileFinder\FileFinder.exe --version

      # Step 8: Upload build artifacts
      - name: Upload macOS App Bundle artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: FileFinder-macOS-py${{ matrix.python-version }}
          path: dist/FileFinder.app
          if-no-files-found: error

      - name: Upload Linux Application artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: FileFinder-Linux-py${{ matrix.python-version }}
          path: dist/FileFinder
          if-no-files-found: error

      - name: Upload Windows Executable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FileFinder-Windows-py${{ matrix.python-version }}
          path: dist/FileFinder
          if-no-files-found: error
