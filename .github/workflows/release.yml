name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: FileFinder-macOS
            archive_cmd: cd dist && zip -r ../FileFinder-macOS.zip FileFinder.app
            archive_file: FileFinder-macOS.zip
          - os: windows-latest
            artifact_name: FileFinder-Windows
            archive_cmd: Compress-Archive -Path dist\FileFinder -DestinationPath FileFinder-Windows.zip
            archive_file: FileFinder-Windows.zip
          - os: ubuntu-latest
            artifact_name: FileFinder-Linux
            archive_cmd: cd dist && tar czf ../FileFinder-Linux.tar.gz FileFinder
            archive_file: FileFinder-Linux.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system Qt dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-sync1 \
            libxi6 \
            libxrender1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run linter
        run: ruff check .

      - name: Run type checker
        run: mypy app

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/

      - name: Build with PyInstaller
        run: pyinstaller packaging/filefinder.spec --clean --noconfirm

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/FileFinder.app/Contents/MacOS/FileFinder --version

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./dist/FileFinder/FileFinder --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: .\dist\FileFinder\FileFinder.exe --version

      - name: Create archive
        run: ${{ matrix.archive_cmd }}
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_file }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/FileFinder-macOS/FileFinder-macOS.zip
            artifacts/FileFinder-Windows/FileFinder-Windows.zip
            artifacts/FileFinder-Linux/FileFinder-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
